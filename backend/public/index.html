<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regula POC Review</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --ink: #1c2520;
        --muted: #68736d;
        --line: #d9d3c8;
        --panel: #fffdf8;
        --pass: #12633d;
        --fail: #9b2424;
        --recapture: #9a650d;
        --unknown: #4d5a64;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: linear-gradient(180deg, #fbf8f0 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: ui-sans-serif, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        padding: 22px clamp(16px, 4vw, 44px);
      }

      h1 {
        font-size: clamp(24px, 4vw, 42px);
        line-height: 1;
        margin: 0 0 8px;
      }

      .muted {
        color: var(--muted);
      }

      main {
        display: grid;
        grid-template-columns: minmax(260px, 360px) 1fr;
        min-height: calc(100vh - 96px);
      }

      aside {
        border-right: 1px solid var(--line);
        padding: 18px;
      }

      section {
        padding: 18px;
      }

      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }

      .session {
        width: 100%;
        display: block;
        margin-bottom: 10px;
        padding: 12px;
        text-align: left;
        border-radius: 8px;
      }

      .session:hover,
      .session.active {
        border-color: #1c2520;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .toolbar button {
        border-radius: 8px;
        padding: 10px 12px;
      }

      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }

      .verdict {
        display: inline-flex;
        border-radius: 999px;
        color: white;
        font-weight: 700;
        padding: 7px 11px;
      }

      .PASS {
        background: var(--pass);
      }

      .FAIL {
        background: var(--fail);
      }

      .RECAPTURE {
        background: var(--recapture);
      }

      .PENDING,
      .INCONCLUSIVE,
      .DEVICE_NOT_CONFIRMED {
        background: var(--unknown);
      }

      img {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      td,
      th {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      pre {
        overflow: auto;
        max-height: 420px;
        padding: 12px;
        border-radius: 8px;
        background: #151914;
        color: #eef5ea;
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Regula POC Review</h1>
      <div class="muted">Sesiones capturadas desde la app Android y resultados del SDK.</div>
    </header>
    <main>
      <aside>
        <div class="toolbar">
          <button id="refresh">Actualizar</button>
        </div>
        <div id="sessions" class="muted">Cargando sesiones...</div>
      </aside>
      <section id="detail">
        <div class="panel muted">Selecciona una sesión para revisar documentos, imágenes y checks.</div>
      </section>
    </main>

    <script>
      const sessionsNode = document.querySelector("#sessions");
      const detailNode = document.querySelector("#detail");
      const refreshButton = document.querySelector("#refresh");
      let activeSessionId = "";

      refreshButton.addEventListener("click", loadSessions);
      loadSessions();

      async function loadSessions() {
        sessionsNode.textContent = "Cargando sesiones...";
        const response = await fetch("/api/v1/sessions");
        const data = await response.json();
        sessionsNode.innerHTML = "";

        if (!data.sessions?.length) {
          sessionsNode.textContent = "No hay sesiones.";
          return;
        }

        for (const session of data.sessions) {
          const button = document.createElement("button");
          button.className = `session ${session.sessionId === activeSessionId ? "active" : ""}`;
          button.innerHTML = `
            <strong>${session.summary?.label || "Sin resultado"}</strong><br />
            <span class="muted">${session.createdAt}</span><br />
            <span class="muted">${session.sessionId}</span>
          `;
          button.addEventListener("click", () => loadSession(session.sessionId));
          sessionsNode.appendChild(button);
        }
      }

      async function loadSession(sessionId) {
        activeSessionId = sessionId;
        await loadSessions();
        detailNode.innerHTML = '<div class="panel muted">Cargando detalle...</div>';
        const response = await fetch(`/api/v1/sessions/${sessionId}/summary`);
        const session = await response.json();
        renderDetail(session);
      }

      function renderDetail(session) {
        const summary = session.summary || {};
        const docTypes = session.payload?.documentTypes || [];
        const checks = summary.failedChecks || [];
        const warnings = summary.warningChecks || [];
        const images = session.images || [];
        const captureDevice = session.payload?.captureDevice || {};

        detailNode.innerHTML = `
          <div class="panel">
            <span class="verdict ${summary.verdict || "PENDING"}">${summary.label || "Pendiente"}</span>
            <h2>${docTypes[0]?.name || "Documento no identificado"}</h2>
            <p>${summary.explanation || ""}</p>
            <p class="muted">sessionId: ${session.sessionId}</p>
          </div>

          <div class="grid">
            <div class="panel">
              <h3>Estado SDK</h3>
              ${statusTable(summary.status)}
            </div>
            <div class="panel">
              <h3>Dispositivo</h3>
              ${statusTable({
                readerMode: captureDevice.readerMode || "desconocido",
                deviceName: captureDevice.deviceName || "desconocido",
                deviceAddress: captureDevice.deviceAddress || "desconocido",
                authenticatorConfirmed: captureDevice.authenticatorConfirmed === true
              })}
            </div>
            <div class="panel">
              <h3>Documento</h3>
              <pre>${escapeHtml(JSON.stringify(docTypes, null, 2))}</pre>
            </div>
          </div>

          <div class="panel">
            <h3>Imágenes</h3>
            <div class="grid">
              ${images.map(imageCard).join("") || '<span class="muted">Sin imágenes.</span>'}
            </div>
          </div>

          <div class="panel">
            <h3>Checks fallidos</h3>
            ${checksTable(checks)}
          </div>

          <div class="panel">
            <h3>Warnings / no ejecutados</h3>
            ${checksTable(warnings)}
          </div>
        `;
      }

      function statusTable(status) {
        if (!status) return '<span class="muted">Sin estado.</span>';
        return `<table>${Object.entries(status)
          .map(([key, value]) => `<tr><th>${key}</th><td>${checkValue(value)}</td></tr>`)
          .join("")}</table>`;
      }

      function checkValue(value) {
        if (value === 1) return "1 OK";
        if (value === 0) return "0 ERROR";
        if (value === 2) return "2 NO_EJECUTADO";
        return String(value);
      }

      function imageCard(image) {
        return `
          <div>
            <a href="${image.url}" target="_blank" rel="noreferrer">
              <img src="${image.url}" alt="${escapeHtml(image.type)}" loading="lazy" />
            </a>
            <strong>${escapeHtml(image.type)}</strong><br />
            <span class="muted">${Math.round((image.size || 0) / 1024)} KB</span>
          </div>
        `;
      }

      function checksTable(checks) {
        if (!checks.length) return '<span class="muted">Sin registros.</span>';
        return `
          <table>
            <thead>
              <tr><th>Check</th><th>Elemento</th><th>Estado</th><th>Diagnóstico</th></tr>
            </thead>
            <tbody>
              ${checks.map((check) => `
                <tr>
                  <td>${escapeHtml(check.checkName || "")}</td>
                  <td>${escapeHtml(check.elementName || "")}</td>
                  <td>${checkValue(check.status)}</td>
                  <td>${escapeHtml(check.diagnoseName || "")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
